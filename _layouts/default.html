<!-- Theme Toggle & Controls Styles -->

<style>
:root {
--bg-colour: #E8E8D8;
--text-colour: #333333;
--table-border-colour: #333333;
--table-header-bg: #D8D8C8;
--site-title-colour: #333333;

/* Light theme links */
--link-colour: #B000B0;
--link-visited-colour: #008B8B;
--link-hover-colour: #937500;
--link-active-colour: #937500;

/* Blockquote text colour (Light mode) */
--blockquote-text-colour: #555555;
}

body {
margin: 0;
padding: 0px;
background: var(--bg-colour);
color: var(--text-colour);
font-family: sans-serif;
}

/* Merriweather Font Switch Target */
body.merriweather-font .page-content {
    font-family: 'Merriweather', serif;
    font-size: 0.93em;
    line-height: 1.5;
}

@media screen and (min-width: 600px) {
    body {
        padding-left: 20px;
        padding-right: 20px;
    }
}

/* Post dates */

body.dark .post-meta,
body.dark .post-meta *,
body.dark time,
body.dark .dt-published {
    color: #D8D8D8 !important;
}

body.dark {
--bg-colour: #404040;
--text-colour: #F2F2F2;

--table-border-colour: #F2F2F2;
--table-header-bg: #505050;

--site-title-colour: #F2F2F2;

/* Dark theme links */
--link-colour: #F55FFF;
--link-visited-colour: #00CCCC;
--link-hover-colour: #ECC33E;
--link-active-colour: #ECC33E;

/* Minima dark-mode extras */
--header-footer-bg: #404040;
--header-footer-border: #666666;
--nav-text-colour: #F2F2F2;
--meta-colour: #B0B0B0;

--blockquote-border: #AAAAAA;
--blockquote-bg: #4A4A4A;
--blockquote-text-colour: #D8D8D8;

--code-bg: #2A2A2A;
--code-text: #333333;

--pre-bg: #252525;
--pre-border: #666666;
}

/* Page */

body {
background: var(--bg-colour);
color: var(--text-colour);
}

/* Blockquotes */

blockquote,
blockquote p {
    color: var(--blockquote-text-colour);
}

/* Hyperlinks */

a:link {
color: var(--link-colour);
}

a:visited {
color: var(--link-visited-colour);
}

a:hover {
color: var(--link-hover-colour);
}

a:active {
color: var(--link-active-colour);
}

/* Site Title */

.site-title,
.site-title:link,
.site-title:visited,
.site-title:hover,
.site-title:active,
.site-title:focus {
    color: var(--site-title-colour) !important;
}

/* Header */

body.dark .site-header {
background: var(--header-footer-bg);
border-top-color: var(--header-footer-border);
border-bottom-color: var(--header-footer-border);
}

/* Footer */

body.dark .site-footer {
background: var(--header-footer-bg);
border-top-color: var(--header-footer-border);
}

/* Tables */

table {
width: 100%;
border-collapse: collapse;
margin: 1em 0;
color: var(--text-colour);
}

th,
td {
border: 1px solid var(--table-border-colour);
padding: 8px 12px;
text-align: left;
vertical-align: top;
color: var(--text-colour);
}

tbody tr:nth-child(odd),
tbody tr:nth-child(even) {
background: transparent !important;
}

tr {
color: var(--text-colour);
}

table,
thead,
tbody,
tfoot,
tr,
th,
td {
color: var(--text-colour);
}

body.dark code,
body.dark pre,
body.dark pre code {
color: #333333 !important;
}

/* Desktop links */
body.dark .site-nav .page-link,
body.dark .site-nav .page-link:link,
body.dark .site-nav .page-link:visited,
body.dark .site-nav .page-link:hover,
body.dark .site-nav .page-link:active,
body.dark .site-nav .page-link:focus {
    color: #F2F2F2 !important;
}

/* Mobile dropdown links */
body.dark .site-nav input:checked ~ .trigger .page-link,
body.dark .site-nav input:checked ~ .trigger .page-link:link,
body.dark .site-nav input:checked ~ .trigger .page-link:visited,
body.dark .site-nav input:checked ~ .trigger .page-link:hover,
body.dark .site-nav input:checked ~ .trigger .page-link:active,
body.dark .site-nav input:checked ~ .trigger .page-link:focus {
    color: #333333 !important;
}
  
@media screen and (max-width: 750px) {
    /* Hamburger button container */
    body.dark .site-nav {
        background-color: #F2F2F2 !important;
    }

    /* Open dropdown panel */
    body.dark .site-nav input:checked ~ .trigger {
        background-color: #F2F2F2 !important;
        border-radius: 0 0 10px 10px;
    }

<!-- Camera Controls & Dials Styles -->

<style>
.camera-controls {
    margin-left: auto;
    margin-right: auto;
    margin-top: -40px;
    padding-bottom: 40px;
    text-align: center;
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

/* Exposure Dial */

.dial-wrapper {
    position: relative;
    cursor: pointer;
    user-select: none;
    transform: scale(0.35);
    transform-origin: center center;
    margin: -40px;
}

.index-marker {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 16px;
    background: #cc0000;
    border-radius: 2px;
    z-index: 10;
}

.dial {
    position: relative;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e4e4e4, #bdbdbd 60%, #8b8b8b);
    border: 2px solid #666;
    transition: transform .35s ease;
}

.dial::before {
    content: "";
    position: absolute;
    inset: 25px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.2);
}

.dial::after {
    content: "EXP";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .15em;
    color: #222;
}

.mark {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100%;
    height: 100%;
    transform-origin: center center;
    font-size: 13px;
    font-weight: 600;
    color: #222;
}

.mark span {
    position: absolute;
    top: 5px;
    left: 50%;
    white-space: nowrap;
}

.m1 { transform: translate(-50%,-50%) rotate(-90deg); }
.m2 { transform: translate(-50%,-50%) rotate(-60deg); }
.m3 { transform: translate(-50%,-50%) rotate(-30deg); }
.m4 { transform: translate(-50%,-50%) rotate(0deg); }
.m5 { transform: translate(-50%,-50%) rotate(30deg); }
.m6 { transform: translate(-50%,-50%) rotate(60deg); }
.m7 { transform: translate(-50%,-50%) rotate(90deg); }

.m1 span { transform: translateX(-50%) rotate(90deg); }
.m2 span { transform: translateX(-50%) rotate(60deg); }
.m3 span { transform: translateX(-50%) rotate(30deg); }
.m4 span { transform: translateX(-50%) rotate(0deg); }
.m5 span { transform: translateX(-50%) rotate(-30deg); }
.m6 span { transform: translateX(-50%) rotate(-60deg); }
.m7 span { transform: translateX(-50%) rotate(-90deg); }

/* AF/MF Switch */

.jxl-switch-container {
    display: flex;
    justify-content: center;
    margin: 0 -22px;
}

.jxl-switch {
    position: relative;
    width: 100px;
    height: 44px;
    background: linear-gradient(to bottom, #ebebeb, #cccccc);
    border: 2px solid #666;
    border-radius: 24px;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
    transform: scale(0.5);
    transform-origin: center center;
}

.jxl-label {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    color: #222;
    pointer-events: none;
}

.jxl-label.manual {
    left: 11px;
}

.jxl-label.auto {
    right: 11px;
}

.jxl-slider {
    position: absolute;
    top: 3px;
    left: 4px;
    width: 44px;
    height: 34px;
    border-radius: 17px;
    background: linear-gradient(to bottom,#f5f5f5,#bcbcbc);
    border: 1px solid #777;
    transition: left .25s ease;
}

.jxl-slider::before {
    content: "";
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 18px;
    background: repeating-linear-gradient(
        90deg,
        #888 0,
        #888 2px,
        transparent 2px,
        transparent 4px
    );
    opacity: .5;
}

.jxl-switch.af .jxl-slider {
    left: 4px;
}

.jxl-switch.mf .jxl-slider {
    left: 48px;
}

/* Buttons (Restored to original template class names) */

.camera-button-wrapper {
    position: relative;
    cursor: pointer;
    user-select: none;
    transform: scale(0.2625);
    transform-origin: center center;
    margin: -48px;
}

.camera-button {
    position: relative;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e4e4e4, #bdbdbd 60%, #8b8b8b);
    border: 2px solid #666;
    transition: transform .2s ease, filter .2s ease;
}

.camera-button:hover {
    filter: brightness(1.05);
}

.camera-button::before {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.2);
}

.camera-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.camera-icon svg {
    width: 56px;
    height: 56px;
}

.camera-icon line {
    stroke: #222;
    stroke-width: 6;
    stroke-linecap: round;
}

.camera-icon polygon {
    fill: #222;
}
</style>

<!-- Controls Group Markup -->

<div class="camera-controls">

    <!-- Exposure Dial / Theme Toggle -->
    <div class="dial-wrapper" id="themeToggle" title="Theme Toggle">
        <div class="index-marker"></div>

        <div class="dial" id="dial">
            <div class="mark m1"><span>-3</span></div>
            <div class="mark m2"><span>-2</span></div>
            <div class="mark m3"><span>-1</span></div>
            <div class="mark m4"><span>0</span></div>
            <div class="mark m5"><span>+1</span></div>
            <div class="mark m6"><span>+2</span></div>
            <div class="mark m7"><span>+3</span></div>
        </div>
    </div>

    <!-- AF / MF Switch -->
    <div class="jxl-switch-container">
        <div class="jxl-switch af" id="jxlSwitch" title="Font Mode">
            <div class="jxl-label manual">MF</div>
            <div class="jxl-label auto">AF</div>
            <div class="jxl-slider"></div>
        </div>
    </div>

    <!-- Menu Button -->
    <div class="camera-button-wrapper"
         onclick="window.location.href='https://martbetz.github.io/camera_menu';"
         title="Camera Menu">

        <div class="camera-button">
            <div class="camera-icon">
                <svg viewBox="0 0 100 100">
                    <line x1="25" y1="35" x2="75" y2="35"></line>
                    <line x1="25" y1="50" x2="75" y2="50"></line>
                    <line x1="25" y1="65" x2="75" y2="65"></line>
                </svg>
            </div>
        </div>
    </div>

    <!-- Playback Button -->
    <div class="camera-button-wrapper"
         onclick="window.location.href='https://martbetz.github.io/camera_menu';"
         title="Playback">

        <div class="camera-button">
            <div class="camera-icon">
                <svg viewBox="0 0 100 100">
                    <polygon points="38,30 38,70 72,50"></polygon>
                </svg>
            </div>
        </div>
    </div>

</div>

<!-- Scripts -->

<script>
document.addEventListener('DOMContentLoaded', function () {

    const toggle = document.getElementById('themeToggle');
    const dial = document.getElementById('dial');

    function updateDial(isDark) {
        if (isDark) {
            document.body.classList.add('dark');
            /* Dark mode = -2 EV / 60deg rotation */
            dial.style.transform = 'rotate(60deg)';
        } else {
            document.body.classList.remove('dark');
            /* Light mode = 0 EV / 0deg rotation */
            dial.style.transform = 'rotate(0deg)';
        }
    }

    const darkMode = localStorage.getItem('theme') === 'dark';
    updateDial(darkMode);

    toggle.addEventListener('click', function () {
        const isDark = !document.body.classList.contains('dark');
        updateDial(isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

});
</script>

<script>
document.addEventListener('DOMContentLoaded', function(){

    const jxlSwitch = document.getElementById('jxlSwitch');

    function setMode(mode){
        localStorage.setItem('imageMode', mode);
        jxlSwitch.classList.remove('af', 'mf');
        jxlSwitch.classList.add(mode);

        if(mode === 'mf'){
            document.body.classList.add('merriweather-font');
        } else {
            document.body.classList.remove('merriweather-font');
        }
    }

    const savedMode = localStorage.getItem('imageMode') || 'af';
    setMode(savedMode);

    jxlSwitch.addEventListener('click', function(){
        const current = localStorage.getItem('imageMode') || 'af';
        const newMode = current === 'af' ? 'mf' : 'af';
        setMode(newMode);
    });

});
</script>
