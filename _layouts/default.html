<style>
/* Fuji Exposure Dial & Controls Isolation */

.theme-toggle {
    margin-left: auto;
    margin-right: auto;
    margin-top: -40px;
    padding-bottom: 50px;
    text-align: center;
    position: relative;
    z-index: 5;
    pointer-events: none;
}

.theme-toggle > * {
    pointer-events: auto;
    display: inline-block;
    vertical-align: middle;
}

/* Dial Container */

.dial-wrapper {
    position: relative;
    cursor: pointer;
    user-select: none;
    transform: scale(0.35);
    transform-origin: center center;
    margin: -35px;
}

/* Red Index Marker */

.index-marker {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 16px;
    background: #cc0000;
    border-radius: 2px;
    z-index: 10;
}

/* Main Dial */

.dial {
    position: relative;
    width: 130px;
    height: 130px;
    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #e4e4e4,
            #bdbdbd 60%,
            #8b8b8b
        );

    border: 2px solid #666;

    transition: transform .35s ease;
}

/* Inner Ring */

.dial::before {
    content: "";
    position: absolute;
    inset: 25px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.2);
}

/* Centre Label */

.dial::after {
    content: "EXP";
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    font-weight: 700;
    letter-spacing: .15em;
    color: #222;
}

/* Dial Markings */

.mark {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100%;
    height: 100%;
    transform-origin: center center;

    font-size: 13px;
    font-weight: 600;
    color: #222;
}

.mark span {
    position: absolute;
    top: 5px;
    left: 50%;
    white-space: nowrap;
}

/* Mark Positions */

.m1 { transform: translate(-50%,-50%) rotate(-90deg); }
.m2 { transform: translate(-50%,-50%) rotate(-60deg); }
.m3 { transform: translate(-50%,-50%) rotate(-30deg); }
.m4 { transform: translate(-50%,-50%) rotate(0deg); }
.m5 { transform: translate(-50%,-50%) rotate(30deg); }
.m6 { transform: translate(-50%,-50%) rotate(60deg); }
.m7 { transform: translate(-50%,-50%) rotate(90deg); }

/* Keep Labels Upright */

.m1 span { transform: translateX(-50%) rotate(90deg); }
.m2 span { transform: translateX(-50%) rotate(60deg); }
.m3 span { transform: translateX(-50%) rotate(30deg); }
.m4 span { transform: translateX(-50%) rotate(0deg); }
.m5 span { transform: translateX(-50%) rotate(-30deg); }
.m6 span { transform: translateX(-50%) rotate(-60deg); }
.m7 span { transform: translateX(-50%) rotate(-90deg); }


/* Unified Side Button Styles (Shared exact same block) */

.camera-button-wrapper {
    position: relative;
    cursor: pointer;
    user-select: none;
    transform: scale(0.2625);
    transform-origin: center center;
    margin: -48px;
}

.camera-button {
    position: relative;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e4e4e4, #bdbdbd 60%, #8b8b8b);
    border: 2px solid #666;
    transition: transform .2s ease, filter .2s ease;
}

.camera-button:hover {
    filter: brightness(1.05);
}

.camera-button::before {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.2);
}

.camera-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.camera-icon svg {
    width: 56px;
    height: 56px;
}

.camera-icon line {
    stroke: #222;
    stroke-width: 6;
    stroke-linecap: round;
}

.camera-icon polygon {
    fill: #222;
}
</style>

<div class="theme-toggle">

    <!-- Menu Button (Left) -->
    <div class="camera-button-wrapper"
         onclick="window.location.href='https://martbetz.github.io/camera_menu';"
         title="Preferences">
        <div class="camera-button">
            <div class="camera-icon">
                <svg viewBox="0 0 100 100">
                    <line x1="25" y1="35" x2="75" y2="35"></line>
                    <line x1="25" y1="50" x2="75" y2="50"></line>
                    <line x1="25" y1="65" x2="75" y2="65"></line>
                </svg>
            </div>
        </div>
    </div>

    <!-- Exposure Dial Theme Toggle (Center) -->
    <div class="dial-wrapper" id="themeToggle">

        <div class="index-marker"></div>

        <div class="dial" id="dial">

            <div class="mark m1"><span>-3</span></div>
            <div class="mark m2"><span>-2</span></div>
            <div class="mark m3"><span>-1</span></div>
            <div class="mark m4"><span>0</span></div>
            <div class="mark m5"><span>+1</span></div>
            <div class="mark m6"><span>+2</span></div>
            <div class="mark m7"><span>+3</span></div>

        </div>

    </div>

    <!-- Preview Button (Right) -->
    <div class="camera-button-wrapper"
         onclick="window.location.href='https://martbetz.github.io/camera_menu';"
         title="Preview">
        <div class="camera-button">
            <div class="camera-icon">
                <svg viewBox="0 0 100 100">
                    <polygon points="38,30 38,70 72,50"></polygon>
                </svg>
            </div>
        </div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const toggle = document.getElementById('themeToggle');
    const dial = document.getElementById('dial');

    function updateDial(isDark) {

    if (isDark) {
        document.body.classList.add('dark');

        /* Dark mode = -2 EV */
        dial.style.transform = 'rotate(60deg)';

    } else {
        document.body.classList.remove('dark');

        /* Light mode = 0 EV */
        dial.style.transform = 'rotate(0deg)';
    }

}

    
    const darkMode =
        localStorage.getItem('theme') === 'dark';

    updateDial(darkMode);

    toggle.addEventListener('click', function () {

        const isDark =
            !document.body.classList.contains('dark');

        updateDial(isDark);

        localStorage.setItem(
            'theme',
            isDark ? 'dark' : 'light'
        );

    });

});
</script>
