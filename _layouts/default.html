<!-- Theme Toggle -->

<style>
    :root {
        --bg-colour: #E8E8D8;
        --text-colour: #333333;
        --table-border-colour: #333333;

        /* Light theme links */
        --link-colour: #B000B0;
        --link-visited-colour: #008B8B;
        --link-hover-colour: #937500;
        --link-active-colour: #937500;
    }

    body {
        margin: 0;
        padding: 0;
        background: var(--bg-colour);
        color: var(--text-colour);
        font-family: sans-serif;
    }

    body.dark {
        --bg-colour: #404040;
        --text-colour: #F2F2F2;
        --table-border-colour: #F2F2F2;
        --site-title-colour: #F2F2F2;

        /* Dark theme links */
        --link-colour: #F55FFF;
        --link-visited-colour: #00CCCC;
        --link-hover-colour: #ECC33E;
        --link-active-colour: #ECC33E;

        /* Minima dark-mode extras */
        --header-footer-bg: #404040;
        --header-footer-border: #666666;
        --nav-text-colour: #F2F2F2;
        --meta-colour: #B0B0B0;

        --blockquote-border: #AAAAAA;
        --blockquote-bg: #4A4A4A;

        --code-bg: #2A2A2A;
        --code-text: #F2F2F2;

        --pre-bg: #252525;
        --pre-border: #666666;
    }

    /* Hyperlinks */
    a:link {
        color: var(--link-colour);
    }

    a:visited {
        color: var(--link-visited-colour);
    }

    a:hover {
        color: var(--link-hover-colour);
    }

    a:active {
        color: var(--link-active-colour);
    }

    /* Minima Theme Elements */

    body.dark .site-title,
    body.dark .site-title:visited {
        color: var(--site-title-colour);
    }

    body.dark .site-header {
        background: var(--header-footer-bg);
        border-top-color: var(--header-footer-border);
        border-bottom-color: var(--header-footer-border);
    }

    body.dark .site-footer {
        background: var(--header-footer-bg);
        border-top-color: var(--header-footer-border);
    }

    body.dark .site-nav a,
    body.dark .site-nav .page-link {
        color: var(--nav-text-colour);
    }

    body.dark .post-meta {
        color: var(--meta-colour);
    }

    body.dark blockquote {
        border-left: 4px solid var(--blockquote-border);
        background: var(--blockquote-bg);
        color: var(--text-colour);
        padding: 0.5em 1em;
    }

    body.dark code {
        background: var(--code-bg);
        color: var(--code-text);
        border: 1px solid var(--pre-border);
    }

    body.dark pre {
        background: var(--pre-bg);
        color: var(--code-text);
        border: 1px solid var(--pre-border);
    }

    body.dark .highlight {
        background: var(--pre-bg);
        border: 1px solid var(--pre-border);
    }

    body.dark hr {
        border-color: var(--header-footer-border);
    }

    /* Theme Toggle */

    .theme-toggle {

        /* Floating version disabled */
        /*
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 2147483647;
        */

        width: 30px;
        margin: 40px auto;
        text-align: center;
    }

    .theme-toggle input {
        display: none;
    }

    .slider {
        display: block;
        width: 30px;
        height: 17px;
        background: #CB00CB;
        border-radius: 17px;
        cursor: pointer;
        position: relative;
        transition: .3s;
    }

    .slider::before {
        content: "";
        position: absolute;
        width: 13px;
        height: 13px;
        left: 2px;
        top: 2px;
        background: #F2F2F2;
        border-radius: 50%;
        transition: .3s;
    }

    #themeToggle:checked + .slider {
        background: #00B0B0;
    }

    #themeToggle:checked + .slider::before {
        transform: translateX(13px);
    }

    .theme-label {
        margin-top: 8px;
        font-size: 11px;
        font-weight: bold;
        text-align: center;
    }

    /* Tables */

    table {
        border-collapse: collapse;
    }

    table,
    th,
    td {
        border: 1px solid var(--table-border-colour);
    }

    th,
    td {
        padding: 8px;
    }
</style>

<div class="theme-toggle">
    <label>
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
    </label>

    <!--
    <div class="theme-label">Light / Dark</div>
    -->
</div>

<!-- Retain User Preference -->

<script>
document.addEventListener('DOMContentLoaded', function() {

    const toggle = document.getElementById('themeToggle');

    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        toggle.checked = true;
    }

    toggle.addEventListener('change', function() {

        if (this.checked) {
            document.body.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        }

    });

});
</script>

<!-- End of Theme Toggle -->


</html>
