<style>

  /* Decrease specific smaller font sizes (like size="1", size="2") for Merriweather mode only */
body.merriweather-font font[size="1"],
body.merriweather-font font[size="2"],
body.merriweather-font small {
    font-size: 0.7em !important; /* Adjust multiplier (e.g. 0.8em or 0.85em) to make them smaller */
}

  /* Force line height for font size 2 (Slightly tighter default for Lato) */
font[size="2"] {
    line-height: 1.1em !important;
}

  /* Keep Merriweather font size 2 line height slightly looser if needed */
body.merriweather-font font[size="2"] {
    line-height: 1.15em !important;
}

  /* Standardise space between paragraphs for font size 2 only */
p:has(font[size="2"]),
font[size="2"]:has(p) {
    margin-top: 0 !important;
    margin-bottom: 10 !important; 
}

  /* Force all blockquote text, links, and citations to stay strictly identical in size */
blockquote p,
blockquote cite,
blockquote a {
    font-size: 1em !important;
}

  /* Smaller quote text size for Merriweather font mode only */
body.merriweather-font blockquote,
body.merriweather-font blockquote p {
    font-size: 1.10em; /* Adjust this value (e.g., 0.85em to 0.95em) as needed */
}

  /* Forcefully indent all quote blocks and add a 15px right border */
blockquote,
.page-content blockquote {
    margin: 0.5em 0 0.5em 15px !important; /* Top, Right, Bottom, Left Indent */
    padding-left: 15px !important;       /* Space between the left border line and the text */
    padding-right: 15px !important;      /* Space between the text and the right border */
    }

</style>
