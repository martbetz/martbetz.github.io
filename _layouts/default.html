<script>
document.addEventListener('DOMContentLoaded', function () {

    const toggle = document.getElementById('themeToggle');

    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        toggle.checked = true;
    }

    toggle.addEventListener('change', function () {

        if (this.checked) {
            document.body.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        }

    });

});
</script>

<style>
/* Fuji Exposure Dial Theme Toggle */

.theme-toggle {
    margin-left: auto;
    margin-right: auto;
    margin-top: -80px;
    padding-bottom: 5px;
    text-align: center;
    
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0px;
    width: fit-content;
}

/* Dial Container */

.dial-wrapper {
    position: relative;
    cursor: pointer;
    user-select: none;

    /* Same dial as standalone version */
    transform: scale(0.35);
    transform-origin: center center;
    margin: 0 -35px;
}

/* Red Index Marker */

.index-marker {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 16px;
    background: #cc0000;
    border-radius: 2px;
    z-index: 10;
}

/* Main Dial */

.dial {
    position: relative;
    width: 130px;
    height: 130px;
    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #e4e4e4,
            #bdbdbd 60%,
            #8b8b8b
        );

    border: 2px solid #666;

    transition: transform .35s ease;
}

/* Inner Ring */

.dial::before {
    content: "";
    position: absolute;
    inset: 25px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.2);
}

/* Centre Label */

.dial::after {
    content: "EXP";
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    font-weight: 700;
    letter-spacing: .15em;
    color: #222;
}

/* Dial Markings */

.mark {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100%;
    height: 100%;
    transform-origin: center center;

    font-size: 13px;
    font-weight: 600;
    color: #222;
}

.mark span {
    position: absolute;
    top: 5px;
    left: 50%;
    white-space: nowrap;
}

/* Mark Positions */

.m1 { transform: translate(-50%,-50%) rotate(-90deg); }
.m2 { transform: translate(-50%,-50%) rotate(-60deg); }
.m3 { transform: translate(-50%,-50%) rotate(-30deg); }
.m4 { transform: translate(-50%,-50%) rotate(0deg); }
.m5 { transform: translate(-50%,-50%) rotate(30deg); }
.m6 { transform: translate(-50%,-50%) rotate(60deg); }
.m7 { transform: translate(-50%,-50%) rotate(90deg); }

/* Keep Labels Upright */

.m1 span { transform: translateX(-50%) rotate(90deg); }
.m2 span { transform: translateX(-50%) rotate(60deg); }
.m3 span { transform: translateX(-50%) rotate(30deg); }
.m4 span { transform: translateX(-50%) rotate(0deg); }
.m5 span { transform: translateX(-50%) rotate(-30deg); }
.m6 span { transform: translateX(-50%) rotate(-60deg); }
.m7 span { transform: translateX(-50%) rotate(-90deg); }


/* Camera Menu Button */

.menu-button-wrapper{
    position:relative;
    display:inline-block;

    cursor:pointer;
    user-select:none;

    /* Reduced by 25% */
    transform:scale(0.2625);
    transform-origin:center center;
    margin: 0 -42px;
}

.menu-button{
    position:relative;

    width:130px;
    height:130px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #e4e4e4,
            #bdbdbd 60%,
            #8b8b8b
        );

    border:2px solid #666;

    transition:
        transform .2s ease,
        filter .2s ease;
}

.menu-button:hover{
    filter:brightness(1.05);
}

/* Inner Ring - Restored to original inset position */
.menu-button::before{
    content:"";
    position:absolute;
    inset: 4px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,.2);
}

/* MENU Label */

.menu-text{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    font-size:18px;
    font-weight:700;
    letter-spacing:.15em;

    color:#222;

    line-height:1;

    pointer-events:none;
}


/* Camera Focus Switch (AF/MF) */

.camera-switch-wrapper {
    position: relative;
    display: inline-block;
    cursor: pointer;
    user-select: none;
    /* Scaled down to match layout proportions */
    transform: scale(0.5);
    transform-origin: center center;
    margin: 0 -15px;
}

.camera-switch {
    position: relative;
    width: 84px;
    height: 44px;
    background: linear-gradient(to bottom, #d7d7d7, #aaaaaa);
    border: 2px solid #666;
    border-radius: 24px;
    overflow: hidden;
}

.camera-switch-label {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    color: #000;
    pointer-events: none;
}

.camera-switch-label.af {
    left: 10px;
}

.camera-switch-label.mf {
    right: 10px;
}

.camera-switch-slider {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 38px;
    height: 34px;
    border-radius: 17px;
    background: linear-gradient(to bottom, #f5f5f5, #bcbcbc);
    border: 1px solid #777;
    transition: left .25s ease;
}

.camera-switch-slider::before {
    content: "";
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 18px;
    background: repeating-linear-gradient(
        90deg,
        #888 0,
        #888 2px,
        transparent 2px,
        transparent 4px
    );
    opacity: .5;
}

.camera-switch.mf .camera-switch-slider {
    left: 43px;
}
</style>

<div class="theme-toggle">

    <div class="camera-switch-wrapper" id="focusSwitchWrapper" title="Focus Mode">
        <div class="camera-switch" id="cameraSwitch">
            <div class="camera-switch-label af">AF</div>
            <div class="camera-switch-label mf">MF</div>
            <div class="camera-switch-slider"></div>
        </div>
    </div>

    <div class="dial-wrapper" id="themeToggle">

        <div class="index-marker"></div>

        <div class="dial" id="dial">

            <div class="mark m1"><span>-3</span></div>
            <div class="mark m2"><span>-2</span></div>
            <div class="mark m3"><span>-1</span></div>
            <div class="mark m4"><span>0</span></div>
            <div class="mark m5"><span>+1</span></div>
            <div class="mark m6"><span>+2</span></div>
            <div class="mark m7"><span>+3</span></div>

        </div>

    </div>

    <div
        class="menu-button-wrapper"
        onclick="if(window.location.pathname.includes('camera_menu')){history.back();}else{window.location.href='/camera_menu.html';}"
        title="Camera Menu">

        <div class="menu-button">

            <div class="menu-text">
                MENU
            </div>

        </div>

    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const toggle = document.getElementById('themeToggle');
    const dial = document.getElementById('dial');

    function updateDial(isDark) {

    if (isDark) {
        document.body.classList.add('dark');

        /* Dark mode = -2 EV */
        dial.style.transform = 'rotate(60deg)';

    } else {
        document.body.classList.remove('dark');

        /* Light mode = 0 EV */
        dial.style.transform = 'rotate(0deg)';
    }

}

    
    const darkMode =
        localStorage.getItem('theme') === 'dark';

    updateDial(darkMode);

    toggle.addEventListener('click', function () {

        const isDark =
            !document.body.classList.contains('dark');

        updateDial(isDark);

        localStorage.setItem(
            'theme',
            isDark ? 'dark' : 'light'
        );

    });

    // AF/MF Switch State & Persistence Logic
    const cameraSwitch = document.getElementById('cameraSwitch');
    const focusSwitchWrapper = document.getElementById('focusSwitchWrapper');

    // 1. Load saved state on page load
    const savedFocusMode = localStorage.getItem('focusMode') || 'af';
    if (savedFocusMode === 'mf') {
        cameraSwitch.classList.add('mf');
    } else {
        cameraSwitch.classList.remove('mf');
    }

    // 2. Handle click, toggle, and save to localStorage
    focusSwitchWrapper.addEventListener('click', function(){
        const isCurrentlyMf = cameraSwitch.classList.contains('mf');
        
        let newMode;
        if (isCurrentlyMf) {
            cameraSwitch.classList.remove('mf');
            newMode = 'af';
        } else {
            cameraSwitch.classList.add('mf');
            newMode = 'mf';
        }

        // Save state so it persists across page changes
        localStorage.setItem('focusMode', newMode);

        // ==========================================
        // TODO: Add your custom function here later
        // ==========================================
        console.log("Focus switch toggled. Current mode:", newMode.toUpperCase());
    });

});
</script>
