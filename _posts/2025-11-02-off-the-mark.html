<style>

.presgrip-frame{
    position:relative;

    width:400px;
    aspect-ratio:4/3;

    max-width:95vw;
    max-height:95vh;

    margin:20px auto 30px auto;

    background:#4b0d0d;

    border:8px solid #050505;
    box-sizing:border-box;

    overflow:hidden;

    animation:
        presgrip-weave 1.3s infinite,
        presgrip-flicker .35s infinite;
}

.presgrip-frame::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        rgba(255,220,150,.04),
        rgba(255,220,150,.02)
    );

    mix-blend-mode:screen;
}

.presgrip-frame::after{
    content:"";
    position:absolute;
    inset:0;

    background:
    radial-gradient(
        ellipse at center,
        transparent 55%,
        rgba(0,0,0,.15) 75%,
        rgba(0,0,0,.45) 100%
    );

    pointer-events:none;
}

.presgrip-title{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    color:#efe6c8;

    font-family:
        "Arial Narrow",
        "Helvetica Neue",
        Arial,
        sans-serif;

    text-transform:uppercase;

    filter:blur(.25px);
}

.presgrip-main{
    font-size:32px;
    font-weight:500;
    letter-spacing:.22em;
    line-height:1.15;

    text-shadow:
        0 0 1px rgba(255,255,220,.4);

    transform:rotate(-0.15deg);
}

.presgrip-grain{
    position:absolute;
    inset:-20px;

    opacity:.14;

    background-image:
    repeating-radial-gradient(
        circle,
        rgba(255,255,255,.15) 0,
        rgba(255,255,255,.15) .5px,
        transparent 1.5px,
        transparent 4px
    );

    animation:presgrip-grain .25s infinite;
}

@keyframes presgrip-weave{

    0%{
        transform:translate(0px,0px) rotate(0deg);
    }

    17%{
        transform:translate(-0.4px,0.3px) rotate(-0.03deg);
    }

    31%{
        transform:translate(0.2px,-0.5px) rotate(0.02deg);
    }

    52%{
        transform:translate(-0.3px,-0.1px) rotate(-0.02deg);
    }

    68%{
        transform:translate(0.5px,0.2px) rotate(0.03deg);
    }

    84%{
        transform:translate(-0.1px,0.4px) rotate(-0.01deg);
    }

    100%{
        transform:translate(0px,0px) rotate(0deg);
    }
}

@keyframes presgrip-flicker{

    0%   { filter:brightness(1.00); }
    10%  { filter:brightness(1.05); }
    15%  { filter:brightness(.97); }
    22%  { filter:brightness(1.03); }
    31%  { filter:brightness(.95); }
    46%  { filter:brightness(1.06); }
    58%  { filter:brightness(.98); }
    65%  { filter:brightness(1.04); }
    79%  { filter:brightness(.96); }
    89%  { filter:brightness(1.07); }
    100% { filter:brightness(1.00); }
}

@keyframes presgrip-grain{

    0%{
        transform:translate(0,0);
    }

    25%{
        transform:translate(3px,-2px);
    }

    50%{
        transform:translate(-2px,2px);
    }

    75%{
        transform:translate(2px,-1px);
    }

    100%{
        transform:translate(0,0);
    }
}

</style>
